<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Netflix</title>
<style>
  /* ---------- Base ---------- */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root{
    --red:#E50914;
    --bg:#141414;
    --card:#2b2b2b;
    --text:#fff;
    --muted:#b3b3b3;
  }
  html,body{ background:#000; color:var(--text); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; overflow-x:hidden; }
  body{ min-height:100vh; }
  img,video{ display:block; }
  button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
  input,textarea,select{ font-family:inherit; }
  a{ color:inherit; text-decoration:none; }
  ::-webkit-scrollbar{ height:0; width:8px; }
  ::-webkit-scrollbar-thumb{ background:#333; border-radius:8px; }

  .hidden{ display:none !important; }

  /* ---------- Logo wordmark ---------- */
  .logo{
    color:var(--red); font-weight:800; letter-spacing:-1px;
    font-family:"Arial Narrow",Arial,sans-serif; text-transform:uppercase;
    transform:scaleY(1.15); display:inline-block; user-select:none;
    text-shadow:0 0 12px rgba(229,9,20,.25);
  }

  /* ---------- Intro ---------- */
  #intro{
    position:fixed; inset:0; background:#000; z-index:1000;
    display:flex; align-items:center; justify-content:center; flex-direction:column;
  }
  #intro .logo{ font-size:clamp(56px,16vw,190px); animation:introZoom 3.4s cubic-bezier(.6,0,.2,1) forwards; }
  #intro .sub{ margin-top:14px; color:var(--muted); letter-spacing:4px; font-size:13px; opacity:0; animation:fadeIn .8s ease 1s forwards; }
  #intro .skip{
    position:absolute; bottom:26px; right:26px; color:var(--muted);
    border:1px solid #444; padding:8px 16px; border-radius:4px; font-size:13px; letter-spacing:1px;
  }
  #intro .skip:hover{ color:#fff; border-color:#888; }
  @keyframes introZoom{
    0%{ transform:scale(6) scaleY(1.15); opacity:0; filter:blur(6px); }
    18%{ opacity:1; filter:blur(0); }
    55%{ transform:scale(1) scaleY(1.15); }
    82%{ transform:scale(1) scaleY(1.15); opacity:1; }
    100%{ transform:scale(1) scaleY(1.15); opacity:0; }
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  /* ---------- Profile picker ---------- */
  #profiles{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; z-index:500; }
  #profiles h1{ font-size:clamp(26px,5vw,52px); font-weight:400; margin-bottom:44px; text-align:center; }
  .profile-row{ display:flex; gap:clamp(18px,4vw,48px); flex-wrap:wrap; justify-content:center; }
  .profile{ display:flex; flex-direction:column; align-items:center; gap:14px; cursor:pointer; position:relative; }
  .profile .avatar{
    width:clamp(90px,16vw,160px); height:clamp(90px,16vw,160px); border-radius:8px;
    background-size:cover; background-position:center; border:3px solid transparent;
    display:flex; align-items:center; justify-content:center; font-size:56px; font-weight:700; color:#fff;
    transition:border-color .2s ease, transform .2s ease;
  }
  .profile:hover .avatar{ transform:scale(1.04); border-color:#fff; }
  .profile .pname{ color:var(--muted); font-size:clamp(15px,2vw,20px); transition:color .2s; }
  .profile:hover .pname{ color:#fff; }
  .profile .edit-pencil{
    position:absolute; top:6px; right:6px; background:rgba(0,0,0,.7); width:30px; height:30px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:15px; opacity:0; transition:opacity .2s;
  }
  .profile:hover .edit-pencil{ opacity:1; }
  #profiles .manage{ margin-top:48px; border:1px solid var(--muted); color:var(--muted); padding:10px 24px; letter-spacing:2px; font-size:14px; text-transform:uppercase; border-radius:2px; }
  #profiles .manage:hover{ border-color:#fff; color:#fff; }

  /* ---------- Top nav ---------- */
  #browse{ display:none; }
  .nav{
    position:fixed; top:0; left:0; right:0; z-index:200; display:flex; align-items:center; gap:26px;
    padding:18px clamp(16px,4vw,60px); transition:background .3s ease;
    background:linear-gradient(180deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,0) 100%);
  }
  .nav.solid{ background:var(--bg); }
  .nav .logo{ font-size:30px; cursor:pointer; }
  .nav .links{ display:flex; gap:20px; font-size:14px; color:#e5e5e5; }
  .nav .links span{ cursor:default; }
  .nav .links span:hover{ color:#b3b3b3; }
  .nav .spacer{ flex:1; }
  .nav .who{ display:flex; align-items:center; gap:10px; font-size:14px; }
  .nav .who .mini{ width:32px; height:32px; border-radius:4px; background-size:cover; background-position:center; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .nav .icon-btn{ font-size:18px; padding:6px; border-radius:4px; }
  .nav .icon-btn:hover{ background:rgba(255,255,255,.12); }
  .nav .edit-toggle{ border:1px solid #555; padding:7px 14px; border-radius:4px; font-size:13px; letter-spacing:1px; }
  .nav .edit-toggle.on{ background:var(--red); border-color:var(--red); }

  /* ---------- Hero ---------- */
  .hero{ position:relative; height:78vh; min-height:460px; display:flex; align-items:flex-end; }
  .hero .bg{ position:absolute; inset:0; background-size:cover; background-position:center; z-index:0; }
  .hero .bg.kenburns{ animation:kenburns 26s ease-in-out infinite alternate; }
  @keyframes kenburns{ from{ transform:scale(1); } to{ transform:scale(1.12); } }
  .hero video.bg{ width:100%; height:100%; object-fit:cover; }
  .hero .fade{ position:absolute; inset:0; z-index:1;
    background:linear-gradient(90deg, rgba(20,20,20,.9) 0%, rgba(20,20,20,.45) 40%, rgba(20,20,20,0) 70%),
               linear-gradient(0deg, var(--bg) 2%, rgba(20,20,20,0) 45%); }
  .hero .content{ position:relative; z-index:2; padding:0 clamp(16px,4vw,60px) clamp(40px,8vh,120px); max-width:640px; }
  .hero .badge{ display:inline-flex; align-items:center; gap:8px; letter-spacing:3px; font-size:13px; color:#fff; margin-bottom:14px; }
  .hero .badge b{ color:var(--red); font-size:20px; font-weight:800; }
  .hero h2{ font-size:clamp(30px,6vw,74px); font-weight:800; line-height:1; margin-bottom:16px; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .hero p{ font-size:clamp(14px,1.6vw,19px); color:#e5e5e5; line-height:1.4; margin-bottom:22px; text-shadow:0 1px 6px rgba(0,0,0,.7); max-width:560px; }
  .hero .actions{ display:flex; gap:12px; flex-wrap:wrap; }
  .btn-play{ background:#fff; color:#000; padding:11px 28px; border-radius:5px; font-weight:700; font-size:17px; display:flex; align-items:center; gap:9px; }
  .btn-play:hover{ background:rgba(255,255,255,.78); }
  .btn-info{ background:rgba(109,109,110,.6); color:#fff; padding:11px 24px; border-radius:5px; font-weight:600; font-size:17px; display:flex; align-items:center; gap:9px; }
  .btn-info:hover{ background:rgba(109,109,110,.42); }
  .hero .edit-hero{ position:absolute; z-index:3; top:88px; right:clamp(16px,4vw,60px); background:rgba(0,0,0,.65); border:1px solid #555; padding:8px 14px; border-radius:4px; font-size:13px; }

  /* ---------- Rows ---------- */
  .rows{ position:relative; z-index:5; margin-top:-70px; padding-bottom:60px; }
  .row{ margin:0 0 34px; }
  .row .rhead{ display:flex; align-items:center; gap:12px; padding:0 clamp(16px,4vw,60px); margin-bottom:10px; }
  .row h3{ font-size:clamp(16px,1.6vw,22px); font-weight:700; }
  .row .rhead .ractions{ display:flex; gap:6px; }
  .row .rhead button{ background:#222; border:1px solid #444; border-radius:4px; padding:3px 9px; font-size:12px; color:#ccc; }
  .row .rhead button:hover{ background:#333; color:#fff; }
  .track-wrap{ position:relative; }
  .track{ display:flex; gap:8px; overflow-x:auto; scroll-behavior:smooth; padding:12px clamp(16px,4vw,60px); }
  .arrow{ position:absolute; top:0; bottom:0; width:clamp(30px,4vw,54px); z-index:20; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; font-size:26px; opacity:0; transition:opacity .2s; }
  .track-wrap:hover .arrow{ opacity:1; }
  .arrow.left{ left:0; } .arrow.right{ right:0; }
  .arrow:hover{ background:rgba(0,0,0,.75); }

  .card{ position:relative; flex:0 0 auto; width:clamp(160px,20vw,300px); aspect-ratio:16/9; border-radius:6px; overflow:hidden; background:#222; cursor:pointer; transition:transform .28s cubic-bezier(.3,0,.2,1); }
  .card .media{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .card video.media{ width:100%; height:100%; object-fit:cover; }
  .card .grad{ position:absolute; inset:0; }
  .card .label{ position:absolute; left:0; right:0; bottom:0; padding:26px 12px 10px; font-weight:700; font-size:15px;
    background:linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); }
  .card .type-dot{ position:absolute; top:8px; right:8px; background:rgba(0,0,0,.6); border-radius:3px; font-size:10px; padding:2px 6px; letter-spacing:1px; }
  .card .cedit{ position:absolute; top:8px; left:8px; background:rgba(0,0,0,.7); width:28px; height:28px; border-radius:50%; display:none; align-items:center; justify-content:center; font-size:13px; }
  .card:hover{ transform:scale(1.14); z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.7); }
  body.editing .card .cedit{ display:flex; }
  body.editing .card:hover{ transform:scale(1.05); }

  .card.add{ display:flex; align-items:center; justify-content:center; border:2px dashed #555; background:#1c1c1c; }
  .card.add .plus{ font-size:34px; color:#777; }
  .card.add:hover{ transform:none; border-color:#999; }
  .card.add:hover .plus{ color:#fff; }

  .row.add-row{ padding:0 clamp(16px,4vw,60px) 40px; }
  .row.add-row button{ border:2px dashed #555; background:#1a1a1a; color:#aaa; padding:16px; width:100%; border-radius:8px; font-size:15px; letter-spacing:1px; }
  .row.add-row button:hover{ border-color:#999; color:#fff; }

  /* ---------- Detail modal ---------- */
  .modal-back{ position:fixed; inset:0; background:rgba(0,0,0,.75); z-index:800; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow-y:auto; }
  .modal{ background:#181818; width:min(880px,100%); border-radius:8px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.7); animation:pop .25s ease; }
  @keyframes pop{ from{ transform:scale(.94); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal .top{ position:relative; aspect-ratio:16/9; background:#000; }
  .modal .top .media{ position:absolute; inset:0; background-size:cover; background-position:center; }
  .modal .top video, .modal .top img{ width:100%; height:100%; object-fit:contain; background:#000; }
  .modal .top .grad{ position:absolute; inset:0; }
  .modal .top .vfade{ position:absolute; inset:0; background:linear-gradient(0deg,#181818 1%, transparent 40%); pointer-events:none; }
  .modal .top .mtitle{ position:absolute; left:26px; bottom:20px; font-size:clamp(22px,4vw,40px); font-weight:800; text-shadow:0 2px 10px #000; }
  .modal .close{ position:absolute; top:14px; right:14px; background:#181818; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:18px; z-index:5; }
  .modal .body{ padding:22px 26px 30px; }
  .modal .meta{ display:flex; align-items:center; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
  .modal .match{ color:#46d369; font-weight:700; }
  .modal .yr{ color:var(--muted); }
  .modal .tag{ background:#333; border-radius:20px; padding:3px 12px; font-size:12px; color:#ddd; }
  .modal .desc{ color:#d2d2d2; line-height:1.5; font-size:16px; white-space:pre-wrap; }
  .modal .mplay{ background:#fff; color:#000; padding:9px 24px; border-radius:5px; font-weight:700; display:inline-flex; gap:8px; margin-bottom:18px; }
  .modal .mplay:hover{ background:rgba(255,255,255,.8); }

  /* ---------- Player / lightbox ---------- */
  .player-back{ position:fixed; inset:0; background:#000; z-index:900; display:flex; align-items:center; justify-content:center; }
  .player-back video{ max-width:100%; max-height:100%; }
  .player-back .ki{ max-width:100%; max-height:100%; object-fit:contain; animation:kenburns 20s ease-in-out infinite alternate; }
  .player-back .pclose{ position:absolute; top:20px; left:20px; font-size:30px; z-index:5; background:rgba(0,0,0,.4); width:48px; height:48px; border-radius:50%; }
  .player-back .caption{ position:absolute; bottom:34px; left:0; right:0; text-align:center; font-size:20px; text-shadow:0 2px 10px #000; padding:0 20px; }

  /* ---------- Edit forms ---------- */
  .form-back{ position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:850; display:flex; align-items:flex-start; justify-content:center; padding:36px 16px; overflow-y:auto; }
  .form{ background:#1c1c1c; width:min(560px,100%); border-radius:10px; padding:26px; box-shadow:0 20px 60px rgba(0,0,0,.7); }
  .form h3{ font-size:22px; margin-bottom:6px; }
  .form .hint{ color:var(--muted); font-size:13px; margin-bottom:18px; }
  .form label{ display:block; font-size:13px; color:#bbb; margin:14px 0 5px; letter-spacing:.3px; }
  .form input[type=text], .form input[type=number], .form textarea, .form select{
    width:100%; background:#2b2b2b; border:1px solid #444; border-radius:6px; color:#fff; padding:11px 12px; font-size:15px;
  }
  .form textarea{ min-height:78px; resize:vertical; }
  .form input:focus,.form textarea:focus{ outline:none; border-color:#888; }
  .form .media-drop{ border:2px dashed #555; border-radius:8px; padding:18px; text-align:center; color:#999; margin-top:6px; cursor:pointer; position:relative; overflow:hidden; }
  .form .media-drop:hover{ border-color:#999; color:#ccc; }
  .form .media-drop.has{ padding:0; border-style:solid; }
  .form .media-drop .preview{ width:100%; aspect-ratio:16/9; background:#000; background-size:cover; background-position:center; }
  .form .media-drop video{ width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; }
  .form .media-drop .rm{ position:absolute; top:8px; right:8px; background:rgba(0,0,0,.75); padding:5px 10px; border-radius:4px; font-size:12px; }
  .form .swatches{ display:flex; gap:8px; margin-top:6px; flex-wrap:wrap; }
  .form .swatch{ width:34px; height:34px; border-radius:6px; border:2px solid transparent; }
  .form .swatch.sel{ border-color:#fff; }
  .form .actions{ display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
  .form .actions .save{ background:var(--red); color:#fff; padding:11px 26px; border-radius:6px; font-weight:700; }
  .form .actions .save:hover{ background:#c40812; }
  .form .actions .cancel{ background:#333; padding:11px 22px; border-radius:6px; }
  .form .actions .cancel:hover{ background:#444; }
  .form .actions .del{ background:transparent; border:1px solid #703; color:#f77; padding:11px 18px; border-radius:6px; margin-left:auto; }
  .form .actions .del:hover{ background:#3a0010; }
  .form .row2{ display:flex; gap:12px; } .form .row2 > div{ flex:1; }
  .form .settings-links{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  .form .settings-links button{ background:#2b2b2b; border:1px solid #444; border-radius:6px; padding:9px 14px; font-size:13px; }
  .form .settings-links button:hover{ background:#3a3a3a; }
  .form .toggle{ display:flex; align-items:center; gap:10px; margin-top:14px; font-size:14px; color:#ccc; }
  .form .toggle input{ width:18px; height:18px; }
  .form .publish-note{ background:#241a05; border:1px solid #6b4c00; color:#f0c667; border-radius:8px; padding:14px; font-size:13px; line-height:1.5; margin-top:18px; }

  /* ---------- Edit hint banner ---------- */
  .hint-banner{ position:fixed; bottom:0; left:0; right:0; z-index:150; background:rgba(0,0,0,.92); border-top:1px solid #333; padding:12px 18px; display:flex; align-items:center; gap:14px; font-size:14px; }
  .hint-banner b{ color:var(--red); }
  .hint-banner .x{ margin-left:auto; background:#333; padding:6px 12px; border-radius:4px; }
  .hint-banner .x:hover{ background:#444; }

  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#333; border:1px solid #555; padding:12px 22px; border-radius:6px; z-index:2000; font-size:14px; opacity:0; transition:opacity .3s, transform .3s; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  @media (max-width:600px){
    .nav .links{ display:none; }
    .hero{ height:70vh; }
  }
</style>
</head>
<body>

<!-- INTRO -->
<div id="intro">
  <div class="logo" id="introLogo">NETFLIX</div>
  <div class="sub" id="introSub">A LOVE ORIGINAL</div>
  <button class="skip" onclick="skipIntro()">Skip intro ⏭</button>
</div>

<!-- PROFILE PICKER -->
<div id="profiles" class="hidden">
  <h1>Who's watching?</h1>
  <div class="profile-row" id="profileRow"></div>
  <button class="manage" id="manageBtn" onclick="toggleManage()">Manage Profiles</button>
</div>

<!-- BROWSE -->
<div id="browse">
  <div class="nav" id="nav">
    <div class="logo" id="navLogo" onclick="goProfiles()">NETFLIX</div>
    <div class="links">
      <span>Home</span><span>Our Story</span><span>My List</span><span>New &amp; Hot</span>
    </div>
    <div class="spacer"></div>
    <button class="edit-toggle" id="editToggle" onclick="toggleEdit()">✎ Edit</button>
    <button class="icon-btn" onclick="openSettings()" title="Settings">⚙</button>
    <div class="who" id="navWho"></div>
  </div>
  <div id="heroMount"></div>
  <div class="rows" id="rowsMount"></div>
</div>

<div id="overlayMount"></div>
<div id="toast" class="toast"></div>

<script>
/* ============================================================
   OURFLIX — an editable, Netflix-style memory site for two.

   HOW PUBLISHING WORKS:
   All edits (photos, videos, text) are saved in this browser
   (localStorage + IndexedDB) so the person editing can work
   freely offline. To make those edits visible to someone else
   opening the site link, use Settings → "Export backup", send
   that file to Claude, and ask Claude to publish it — Claude
   will bake it into SEED_CONFIG/SEED_MEDIA below and redeploy,
   so any fresh visitor (like your partner) sees the update.
   ============================================================ */

/* ---------- Placeholder gradients (used before you add media) ---------- */
const GRADS = [
  "linear-gradient(135deg,#7b2ff7,#f107a3)",
  "linear-gradient(135deg,#f7971e,#ffd200)",
  "linear-gradient(135deg,#11998e,#38ef7d)",
  "linear-gradient(135deg,#ee0979,#ff6a00)",
  "linear-gradient(135deg,#2193b0,#6dd5ed)",
  "linear-gradient(135deg,#c31432,#240b36)",
  "linear-gradient(135deg,#654ea3,#eaafc8)",
  "linear-gradient(135deg,#f12711,#f5af19)"
];
const gradFor = i => GRADS[i % GRADS.length];

/* ---------- Default content (fully editable in the app) ---------- */
function uid(){ return 'x'+Math.random().toString(36).slice(2,9); }

function placeholderItem(title, desc, g){
  return { id:uid(), title, year:"", match:98, tags:[], desc, longDesc:desc, mediaId:null, mediaType:null, grad:g };
}

const DEFAULT_CONFIG = {
  logoText:"NETFLIX",
  tabTitle:"Netflix",
  introEnabled:true,
  soundEnabled:true,
  profiles:[
    {
      id:"p1", name:"For You", color:"#E50914", avatarMediaId:null,
      hero:{ badge:"OUR STORY", title:"The Story of Us",
             desc:"Every moment, every trip, every small ordinary day that turned out to matter. Press play and let's relive it.",
             mediaId:null, mediaType:null, bgColor:"#4a1616" },
      rows:[
        { id:uid(), title:"Continue Watching for You", items:[
          placeholderItem("The Day We Met","Where it all began. Replace this with your real first-memory photo or a video.",0),
          placeholderItem("First Date","Add the photo from your first date here.",3),
          placeholderItem("Late Night Talks","Those 2am conversations that made everything click.",6),
        ]},
        { id:uid(), title:"Trending in Our World", items:[
          placeholderItem("The Trip We'll Never Forget",": Add a favourite travel memory.",4),
          placeholderItem("That Concert","The night we sang until we lost our voices.",1),
          placeholderItem("Home Cooked","When we tried to cook and nearly burned the kitchen.",2),
        ]},
      ]
    },
    {
      id:"p2", name:"Just Us", color:"#4b8ef0", avatarMediaId:null,
      hero:{ badge:"BEHIND THE SCENES", title:"The Little Things",
             desc:"The unglamorous, in-between, real stuff. The silly faces, the inside jokes, the ordinary days. This is my favourite show.",
             mediaId:null, mediaType:null, bgColor:"#16324a" },
      rows:[
        { id:uid(), title:"Because You're My Favourite Person", items:[
          placeholderItem("Silly Faces","A collection of the faces only I get to see.",7),
          placeholderItem("Inside Jokes","The ones nobody else would understand.",5),
          placeholderItem("Lazy Sundays","Doing nothing, together. The best episodes.",2),
        ]},
        { id:uid(), title:"Coming Soon", items:[
          placeholderItem("All The Places We'll Go","Add a photo of a place you dream of visiting together.",4),
          placeholderItem("Our Someday","Leave a little note about the future here.",0),
        ]},
      ]
    }
  ]
};

/* ============================================================
   PUBLISHED SEED — this is what Claude edits when you ask it to
   publish an exported backup. A fresh visitor (no local edits
   yet, e.g. your partner's browser) always boots from this.
   SEED_VERSION is bumped by Claude on every publish so browsers
   that already have older seeded data pick up the new one.
   ============================================================ */
const SEED_VERSION = 0; // bumped by Claude each time a new export is published
const SEED_CONFIG = null;   // replaced with your exported `config` object on publish
const SEED_MEDIA  = null;   // replaced with your exported `media` object (base64) on publish

/* ============================================================
   Storage: config in localStorage, media blobs in IndexedDB
   ============================================================ */
const LS_KEY = "ourflix_config_v1";
const SEED_KEY = "ourflix_seed_version";

function loadConfig(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw) return JSON.parse(raw); }catch(e){}
  return structuredClone(DEFAULT_CONFIG);
}

/* IndexedDB for media */
let _db=null;
function db(){
  return new Promise((res,rej)=>{
    if(_db) return res(_db);
    const r = indexedDB.open("ourflix_media",1);
    r.onupgradeneeded = e => { e.target.result.createObjectStore("media"); };
    r.onsuccess = e => { _db=e.target.result; res(_db); };
    r.onerror = e => rej(e);
  });
}
async function putMedia(id, blob, type){
  const d=await db();
  return new Promise((res,rej)=>{ const tx=d.transaction("media","readwrite"); tx.objectStore("media").put({blob,type},id); tx.oncomplete=()=>res(); tx.onerror=rej; });
}
async function getMedia(id){
  const d=await db();
  return new Promise((res)=>{ const tx=d.transaction("media","readonly"); const rq=tx.objectStore("media").get(id); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); });
}
async function delMedia(id){
  if(!id) return; const d=await db();
  return new Promise((res)=>{ const tx=d.transaction("media","readwrite"); tx.objectStore("media").delete(id); tx.oncomplete=()=>res(); });
}
const urlCache={};
async function mediaUrl(id){
  if(!id) return null;
  if(urlCache[id]) return urlCache[id];
  const m=await getMedia(id); if(!m) return null;
  const u=URL.createObjectURL(m.blob); urlCache[id]=u; return u;
}

/* Seed IndexedDB + config from a published SEED_CONFIG/SEED_MEDIA bundle,
   but only once per SEED_VERSION and only if this browser has no local
   edits of its own yet (so we never clobber someone's in-progress edits). */
async function maybeSeed(){
  if(!SEED_CONFIG) return; // nothing published yet, just the template
  const seenVersion = parseInt(localStorage.getItem(SEED_KEY)||"-1");
  if(seenVersion >= SEED_VERSION) return; // this browser is already up to date
  // fresh browser, or a newer publish is available: load the seed
  localStorage.setItem(LS_KEY, JSON.stringify(SEED_CONFIG));
  localStorage.setItem(SEED_KEY, String(SEED_VERSION));
  if(SEED_MEDIA){
    for(const id in SEED_MEDIA){
      const m = SEED_MEDIA[id];
      const blob = base64ToBlob(m.data, m.mime||"application/octet-stream");
      await putMedia(id, blob, m.type);
    }
  }
}

/* Fill any element carrying data-mid / data-mid-bg with its media */
async function hydrate(scope){
  scope=scope||document;
  const nodes=scope.querySelectorAll("[data-mid]");
  for(const n of nodes){
    const id=n.getAttribute("data-mid"); const type=n.getAttribute("data-mtype");
    const u=await mediaUrl(id); if(!u) continue;
    if(type==="video"){
      const v=document.createElement("video");
      v.src=u; v.muted=true; v.loop=true; v.playsInline=true; v.autoplay=true;
      v.className=n.className; v.setAttribute("data-role",n.getAttribute("data-role")||"");
      if(n.dataset.contain==="1") v.style.objectFit="contain";
      n.replaceWith(v); v.play().catch(()=>{});
    } else {
      n.style.backgroundImage=`url(${u})`;
      const g=n.querySelector(".grad"); if(g) g.style.display="none";
    }
  }
}

/* Synthesized cinematic hit (not the Netflix sound) */
function playThud(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const now=ac.currentTime;
    [110,146].forEach((f,idx)=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.setValueAtTime(f,now+idx*0.12);
      g.gain.setValueAtTime(0.0001,now+idx*0.12);
      g.gain.exponentialRampToValueAtTime(0.5,now+idx*0.12+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,now+idx*0.12+0.6);
      o.connect(g).connect(ac.destination); o.start(now+idx*0.12); o.stop(now+idx*0.12+0.7);
    });
  }catch(e){}
}

/* ---- Media picker helper: builds a drop zone bound to a temp state ---- */
function mediaDropHtml(state){
  if(state.mediaId && state.previewUrl){
    if(state.mediaType==="video"){
      return `<div class="media-drop has"><video src="${state.previewUrl}" muted></video><button class="rm" onclick="clearDrop(this)">Remove</button></div>`;
    }
    return `<div class="media-drop has"><div class="preview" style="background-image:url(${state.previewUrl})"></div><button class="rm" onclick="clearDrop(this)">Remove</button></div>`;
  }
  return `<div class="media-drop" onclick="this.querySelector('input').click()">
     <div>📷 / 🎬  Click to add a photo or video</div>
     <input type="file" accept="image/*,video/*" style="display:none" onchange="onPickMedia(this)">
   </div>`;
}
let _pendingMedia=null; // {blob,type,url,id}
function onPickMedia(input){
  const f=input.files[0]; if(!f) return;
  const type=f.type.startsWith("video")?"video":"image";
  const url=URL.createObjectURL(f);
  _pendingMedia={ blob:f, type, url, id:uid() };
  const drop=input.closest(".media-drop");
  drop.classList.add("has"); drop.onclick=null;
  drop.innerHTML = type==="video"
    ? `<video src="${url}" muted></video><button class="rm" onclick="clearDrop(this)">Remove</button>`
    : `<div class="preview" style="background-image:url(${url})"></div><button class="rm" onclick="clearDrop(this)">Remove</button>`;
}
function clearDrop(btn){
  _pendingMedia={ cleared:true };
  const drop=btn.closest(".media-drop");
  drop.classList.remove("has");
  drop.onclick=function(){ this.querySelector('input').click(); };
  drop.innerHTML=`<div>📷 / 🎬  Click to add a photo or video</div>
     <input type="file" accept="image/*,video/*" style="display:none" onchange="onPickMedia(this)">`;
}

async function saveItem(rid,iid,itemId){
  const p=curProfile(); const r=p.rows.find(x=>x.id===rid);
  let it = iid ? r.items.find(x=>x.id===iid) : null;
  if(!it){ it={ id:itemId, tags:[], grad:Math.floor(Math.random()*GRADS.length) }; r.items.push(it); }
  it.title=val("f_title")||"Untitled";
  it.year=val("f_year");
  it.match=parseInt(val("f_match"))||0;
  it.desc=val("f_desc");
  it.longDesc=val("f_long");
  it.tags=val("f_tags").split(",").map(s=>s.trim()).filter(Boolean);
  // media
  if(_pendingMedia){
    if(_pendingMedia.cleared){ await delMedia(it.mediaId); delete urlCache[it.mediaId]; it.mediaId=null; it.mediaType=null; }
    else { await delMedia(it.mediaId); delete urlCache[it.mediaId]; await putMedia(_pendingMedia.id,_pendingMedia.blob,_pendingMedia.type); it.mediaId=_pendingMedia.id; it.mediaType=_pendingMedia.type; }
  }
  saveConfig(); closeOverlay(); renderBrowse(); toast("Saved ♥");
}

async function deleteItem(rid,iid){

  const p=curProfile(); const r=p.rows.find(x=>x.id===rid);

  await delMedia(it.mediaId);
  r.items=r.items.filter(x=>x.id!==iid);
  saveConfig(); closeOverlay(); renderBrowse();
}

}
let _swatch=null;
function pickSwatch(btn,c){ _swatch=c; document.querySelectorAll(".swatch").forEach(s=>s.classList.remove("sel")); btn.classList.add("sel"); }
async function saveProfile(pid){
  const prof=config.profiles.find(p=>p.id===pid);
  prof.name=val("p_name")||"Profile";
  prof.color=_swatch||prof.color;
  if(_pendingMedia){
    if(_pendingMedia.cleared){ await delMedia(prof.avatarMediaId); delete urlCache[prof.avatarMediaId]; prof.avatarMediaId=null; }
    else { await delMedia(prof.avatarMediaId); delete urlCache[prof.avatarMediaId]; await putMedia(_pendingMedia.id,_pendingMedia.blob,_pendingMedia.type); prof.avatarMediaId=_pendingMedia.id; }
  }
  saveConfig(); closeOverlay(); showProfiles(); toast("Profile saved ♥");
}

/* ============================================================
   Settings (logo, tab title, intro, export/import, reset)
   ============================================================ */
function openSettings(){
  openForm(`
    <h3>Settings</h3>
    <div class="hint">Small touches + your backup.</div>
    <label>Logo text (top-left wordmark)</label>
    <input type="text" id="s_logo" value="${attr(config.logoText)}" placeholder="NETFLIX / OURFLIX / your names">
    <label>Browser tab title</label>
    <input type="text" id="s_tab" value="${attr(config.tabTitle)}" placeholder="Netflix">
    <div class="toggle"><input type="checkbox" id="s_intro" ${config.introEnabled?'checked':''}><span>Play the intro animation on open</span></div>
    <div class="toggle"><input type="checkbox" id="s_sound" ${config.soundEnabled?'checked':''}><span>Play a sound on the intro</span></div>
    <label style="margin-top:18px">Backup &amp; move</label>
    <div class="settings-links">
      <button onclick="exportAll()">⬇ Export backup (with photos)</button>
      <button onclick="document.getElementById('importFile').click()">⬆ Import backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importAll(this)">
    </div>
    <div class="settings-links">
      <button onclick="resetAll()" style="border-color:#703;color:#f77">↺ Reset everything</button>
    </div>
    <div class="publish-note">📤 <b>To publish your edits so they show up for anyone else opening this link:</b> click "Export backup" above, then send the downloaded file to Claude in chat and ask it to publish the update.</div>
    <div class="actions">
      <button class="save" onclick="saveSettings()">Save</button>
      <button class="cancel" onclick="closeOverlay()">Cancel</button>
    </div>
  `);
}
function saveSettings(){
  config.logoText=val("s_logo")||"NETFLIX";
  config.tabTitle=val("s_tab")||"Netflix";
  config.introEnabled=document.getElementById("s_intro").checked;
  config.soundEnabled=document.getElementById("s_sound").checked;
  document.title=config.tabTitle; applyLogoText(); saveConfig(); closeOverlay(); renderBrowse(); toast("Settings saved");
}

/* Export: bundle config + all media as base64 into one JSON file */
async function exportAll(){
  toast("Preparing backup...");
  const bundle={ config:structuredClone(config), media:{} };
  const ids=collectMediaIds();
  for(const id of ids){
    const m=await getMedia(id); if(!m) continue;
    bundle.media[id]={ type:m.type, data:await blobToBase64(m.blob), mime:m.blob.type };
  }
  const blob=new Blob([JSON.stringify(bundle)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="ourflix-backup.json"; a.click();
  toast("Backup downloaded ♥");
}
async function importAll(input){
  const f=input.files[0]; if(!f) return;
  try{
    const bundle=JSON.parse(await f.text());
    for(const id in (bundle.media||{})){
      const m=bundle.media[id];
      const blob=base64ToBlob(m.data,m.mime||"application/octet-stream");
      await putMedia(id,blob,m.type);
    }
    config=bundle.config; saveConfig();
    Object.keys(urlCache).forEach(k=>delete urlCache[k]);
    document.title=config.tabTitle; applyLogoText();
    closeOverlay(); showProfiles(); toast("Backup restored ♥");
  }catch(e){ toast("Couldn't read that file"); }
}
function collectMediaIds(){
  const ids=new Set();
  config.profiles.forEach(p=>{
    if(p.avatarMediaId) ids.add(p.avatarMediaId);
    if(p.hero.mediaId) ids.add(p.hero.mediaId);
    p.rows.forEach(r=>r.items.forEach(it=>{ if(it.mediaId) ids.add(it.mediaId); }));
  });
  return [...ids];
}
function resetAll(){
  if(!confirm("This wipes everything and restores the template. Sure?")) return;
  config=structuredClone(DEFAULT_CONFIG); saveConfig();
  indexedDB.deleteDatabase("ourflix_media"); _db=null;
  Object.keys(urlCache).forEach(k=>delete urlCache[k]);
  document.title=config.tabTitle; applyLogoText(); closeOverlay(); showProfiles();
}

/* ============================================================
   Helpers
   ============================================================ */
function val(id){ const e=document.getElementById(id); return e?e.value.trim():""; }
function escapeHtml(s){ return (s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function attr(s){ return escapeHtml(s).replace(/"/g,"&quot;"); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function blobToBase64(blob){ return new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result.split(",")[1]); r.readAsDataURL(blob); }); }
function base64ToBlob(b64,mime){ const bin=atob(b64); const arr=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i); return new Blob([arr],{type:mime}); }

function maybeShowHint(){
  if(localStorage.getItem("ourflix_hint_seen")) return;
  const b=document.createElement("div"); b.className="hint-banner";
  b.innerHTML=`<span>👋 This is your template. Tap <b>✎ Edit</b> (top right) to add your own photos, videos and words. Everything saves automatically in this browser.</span><button class="x" onclick="this.parentElement.remove();localStorage.setItem('ourflix_hint_seen','1')">Got it</button>`;
  document.body.appendChild(b);
}
</script>
